{%- comment -%} Google Analytics 4 (free tier). Renders only in production builds and when google_analytics is set in _config.yml. {%- endcomment -%}
{%- if jekyll.environment == "production" and site.google_analytics != blank -%}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{%- endif -%}
