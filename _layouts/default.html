<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f4fd1'/%3E%3Ctext x='32' y='42' font-family='Helvetica,Arial,sans-serif' font-size='28' font-weight='700' text-anchor='middle' fill='white'%3EEC%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script>
      /* Opt in to motion only when it is supported and wanted; without this class everything renders static. */
      if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
    </script>
    {% if page.layout == 'wide_default' %}
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
    {% endif %}
  </head>
  <body>
    {% if page.layout == 'wide_default' %}{% include topbar.html article=true %}{% else %}{% include topbar.html %}{% endif %}
    <main>
      {{ content }}
    </main>
    {% include footer.html %}
    <script>
      (function () {
        var root = document.documentElement, motion = root.classList.contains('motion');

        /* Top bar gains its hairline once the page scrolls. */
        var bar = document.querySelector('.topbar');
        if (bar) {
          var onScroll = function () { bar.classList.toggle('is-scrolled', window.scrollY > 4); };
          onScroll(); window.addEventListener('scroll', onScroll, { passive: true });
        }

        /* Scroll reveal: entries rise 14px and fade in once, staggered within each batch. */
        var items = document.querySelectorAll('.reveal');
        if (motion && items.length) {
          var ro = new IntersectionObserver(function (es) {
            var n = 0;
            es.forEach(function (e) {
              if (!e.isIntersecting) return;
              e.target.style.transitionDelay = (n++ * 90) + 'ms';
              e.target.classList.add('is-in');
              ro.unobserve(e.target);
            });
          }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
          for (var i = 0; i < items.length; i++) ro.observe(items[i]);
        }

        /* Spotlight video: plays only while visible; reduced motion gets controls instead of autoplay. */
        var v = document.querySelectorAll('.project-thumb video');
        if (!v.length) return;
        if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          for (var k = 0; k < v.length; k++) v[k].controls = true;
          return;
        }
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) {
            if (e.isIntersecting) { var p = e.target.play(); if (p && p.catch) p.catch(function () {}); }
            else e.target.pause();
          });
        }, { threshold: 0.5 });
        for (var j = 0; j < v.length; j++) io.observe(v[j]);
      })();
    </script>
  </body>
</html>
