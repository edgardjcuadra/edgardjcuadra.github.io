<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
        
    <link rel="stylesheet" href="{{ "/assets/css/wide_style.css?v=" | append: site.github.build_revision | relative_url }}">
    
    <style>
      /* Sidebar / Header Styling */
      header {
        background-color: #707C8F;  /* Your chosen Blue-Grey */
        border-radius: 25px;        /* 1. Round edges for the config area */
        padding: 30px;              /* 2. Add breathing room inside the box */
        color: #ffffff;             /* 3. High Contrast: White text */
        text-align: center;         /* Optional: Centers the content */
      }

      /* Force all text inside the header to be white */
      header h1, header h1 a, header h4, header p {
        color: #ffffff !important;
        text-decoration: none;
      }

      /* Button Styling */
      .contact-btn {
        display: block;             /* Makes buttons stack vertically */
        background-color: #ffffff;  /* White button background */
        color: #707C8F !important;  /* Text color matches the sidebar background */
        padding: 10px 15px;         /* Size of the button */
        margin: 10px auto;          /* Space between buttons */
        border-radius: 8px;         /* Round edges for the buttons themselves */
        font-weight: bold;
        text-decoration: none;
        width: 80%;                 /* Button width relative to sidebar */
        transition: opacity 0.3s;
      }

      .contact-btn:hover {
        opacity: 0.9;               /* Slight effect when hovering */
        text-decoration: none;
      }

      /* Main Content Styling */
      section {
        background-color: #ffffff;
      }
    </style>
    <!-- <style>
      header {
        background-color: #707C8F; /* Try a color that matches your logo or preference */
      }
      section {
        background-color: #ffffff;
      }
    </style> -->

    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
    </head>
  <body>
    <div class="wrapper">
      <header>
        
        {% if site.logo %}
          <img class="img-circle" src="{{site.logo | relative_url}}" alt="Logo" />
        {% endif %}

        <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
        
        <p>{{ site.description | default: site.github.project_tagline }}</p>

      </header>
      <section>

      {{ content }}

      </section>
      <footer>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
    {% if site.google_analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google_analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
  </body>
</html>
