<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
        
    <link rel="stylesheet" href="{{ "/assets/css/wide_style.css?v=" | append: site.github.build_revision | relative_url }}">
    
    <style>
      /* 1. LAYOUT CONTAINER (Prevents Overlap) */
      .wrapper {
        display: flex;              /* Activates side-by-side layout */
        flex-direction: row;        /* Aligns items horizontally */
        justify-content: center;    /* Centers the whole block */
        gap: 50px;                  /* Adds physical space between Sidebar and Content */
        max-width: 1200px;          /* Prevents the page from getting too wide */
        margin: 0 auto;             /* Centers the wrapper on the screen */
        padding: 20px;
      }

      /* 2. SIDEBAR / HEADER STYLING */
      header {
        background-color: #707C8F;  /* Your Blue-Grey */
        border-radius: 25px;        /* Round edges */
        padding: 30px;              /* Internal spacing */
        color: #ffffff;             /* White text */
        text-align: center;
        
        /* Layout Fixes */
        width: 300px;               /* Fixed width so it doesn't expand/shrink */
        flex-shrink: 0;             /* Prevents sidebar from getting squished */
        height: fit-content;        /* Only takes as much height as needed */
        position: relative !important; /* Forces it to respect the layout flow */
      }

      /* Force header text to be white */
      header h1, header h1 a, header h4, header p {
        color: #ffffff !important;
        text-decoration: none;
      }

      /* 3. BUTTON STYLING */
      .contact-btn {
        display: block;
        background-color: #ffffff;
        color: #707C8F !important;
        padding: 10px 15px;
        margin: 10px auto;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        width: 80%;
        transition: opacity 0.3s;
      }

      .contact-btn:hover {
        opacity: 0.9;
      }

      /* 4. MAIN CONTENT STYLING */
      section {
        background-color: #ffffff;
        flex-grow: 1;               /* Allows text area to fill remaining space */
        width: auto !important;     /* Overrides any theme defaults causing issues */
        max-width: 800px;           /* meaningful width for readability */
      }

      /* 5. MOBILE RESPONSIVENESS (Phone View) */
      @media (max-width: 768px) {
        .wrapper {
          flex-direction: column;   /* Stack them vertically on phones */
          gap: 20px;
        }
        header {
          width: 100%;              /* Sidebar takes full width on phone */
          box-sizing: border-box;   /* Ensures padding doesn't break width */
        }
        section {
          width: 100% !important;
        }
      }
    </style>
    

    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
    </head>
  <body>
    <div class="wrapper">
      <header>
        
        {% if site.logo %}
          <img class="img-circle" src="{{site.logo | relative_url}}" alt="Logo" />
        {% endif %}

        <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
        
        <p>{{ site.description | default: site.github.project_tagline }}</p>

      </header>
      <section>

      {{ content }}

      </section>
      <footer>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
    {% if site.google_analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google_analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
  </body>
</html>
